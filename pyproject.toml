[project]
name = "taskowl"
version = "0.1.0"
description = "Modern Celery task monitoring with MCP integration"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Kalvad", email = "contact@kalvad.com" }]
keywords = ["celery", "monitoring", "mcp", "tasks", "rabbitmq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "celery==5.6.3",
    "mcp==2.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "prometheus-client==0.26.0",
]

[project.urls]
Homepage = "https://github.com/KalvadTech/taskowl"
Repository = "https://github.com/KalvadTech/taskowl"
Documentation = "https://github.com/KalvadTech/taskowl"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "ty==0.0.69",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
]

[project.scripts]
taskowl = "taskowl.main:main"
taskowl-consume = "taskowl.consumer.cli:main"
taskowl-mcp = "taskowl.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskowl"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "*.md",
    "docs/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # Allow Depends() in function defaults (FastAPI pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
